<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShyneMC - Sito Ufficiale</title>
    <style>
        /* Stile di Base */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #05020a;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* SFONDO SUPER ANIMATO: DIMENSIONE END & PORTALE */
        .bg-dimension {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at 50% 15%, #2b0d4f 0%, #100421 55%, #05020a 100%);
            overflow: hidden;
            pointer-events: none;
        }

        /* Griglia voxel in scorrimento continuo */
        .bg-grid {
            position: absolute;
            inset: -50px;
            background-image: 
                linear-gradient(to right, rgba(224, 64, 251, 0.12) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(224, 64, 251, 0.12) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
            animation: gridScroll 8s linear infinite;
        }

        @keyframes gridScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50px); }
        }

        /* Vortici/Anelli del Portale rotanti */
        .portal-ring {
            position: absolute;
            top: 30%;
            left: 50%;
            border-radius: 50%;
            border: 2px dashed rgba(224, 64, 251, 0.25);
            box-shadow: 0 0 40px rgba(156, 39, 176, 0.2), inset 0 0 40px rgba(0, 188, 212, 0.15);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .ring-1 {
            width: 600px;
            height: 600px;
            animation: spinClockwise 35s linear infinite;
        }

        .ring-2 {
            width: 900px;
            height: 900px;
            border-color: rgba(0, 188, 212, 0.18);
            border-style: dotted;
            animation: spinCounterClockwise 50s linear infinite;
        }

        @keyframes spinClockwise {
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            50% { transform: translate(-50%, -50%) rotate(180deg) scale(1.08); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(1); }
        }

        @keyframes spinCounterClockwise {
            0% { transform: translate(-50%, -50%) rotate(360deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }

        /* Orbe di energia viola e ciano pulsanti */
        .nebula-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(85px);
            animation: pulseNebula 7s ease-in-out infinite alternate;
        }

        .glow-1 { width: 480px; height: 480px; background: #8e24aa; top: -80px; left: 10%; }
        .glow-2 { width: 520px; height: 520px; background: #4a148c; bottom: -120px; right: 8%; animation-delay: 2.5s; }
        .glow-3 { width: 350px; height: 350px; background: #00bcd4; top: 40%; right: 20%; opacity: 0.22; animation-duration: 9s; }

        @keyframes pulseNebula {
            0% { transform: scale(0.95) translate(0, 0); opacity: 0.35; }
            100% { transform: scale(1.3) translate(40px, -30px); opacity: 0.65; }
        }

        /* Scie luminose diagonali */
        .shooting-star {
            position: absolute;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, #e040fb, transparent);
            box-shadow: 0 0 10px #e040fb;
            opacity: 0;
            transform: rotate(-35deg);
            animation: shoot 6s linear infinite;
        }

        .s1 { top: 15%; left: 85%; animation-delay: 1s; }
        .s2 { top: 35%; left: 95%; animation-delay: 3.5s; background: linear-gradient(90deg, #00bcd4, transparent); }
        .s3 { top: 60%; left: 90%; animation-delay: 5.2s; }

        @keyframes shoot {
            0% { transform: translate(0, 0) rotate(-35deg); opacity: 0; }
            10% { opacity: 1; }
            35% { transform: translate(-600px, 420px) rotate(-35deg); opacity: 0; }
            100% { opacity: 0; }
        }

        /* Particelle dell'End fluttuanti */
        .ender-particle {
            position: absolute;
            background-color: #e040fb;
            box-shadow: 0 0 10px #e040fb, 0 0 20px #9c27b0;
            animation: riseWave linear infinite;
        }

        .p1 { width: 5px; height: 5px; left: 5%; animation-duration: 9s; animation-delay: 0s; }
        .p2 { width: 7px; height: 7px; left: 14%; animation-duration: 12s; animation-delay: 1.5s; background-color: #ea80fc; }
        .p3 { width: 4px; height: 4px; left: 22%; animation-duration: 8s; animation-delay: 3s; background-color: #00bcd4; box-shadow: 0 0 10px #00bcd4; }
        .p4 { width: 6px; height: 6px; left: 31%; animation-duration: 13s; animation-delay: 0.5s; }
        .p5 { width: 5px; height: 5px; left: 40%; animation-duration: 10s; animation-delay: 2.5s; background-color: #ffeb3b; box-shadow: 0 0 8px #ffeb3b; }
        .p6 { width: 7px; height: 7px; left: 49%; animation-duration: 11s; animation-delay: 4s; background-color: #ea80fc; }
        .p7 { width: 4px; height: 4px; left: 58%; animation-duration: 9s; animation-delay: 1s; }
        .p8 { width: 6px; height: 6px; left: 66%; animation-duration: 14s; animation-delay: 3.5s; background-color: #00bcd4; box-shadow: 0 0 10px #00bcd4; }
        .p9 { width: 5px; height: 5px; left: 75%; animation-duration: 10s; animation-delay: 5s; }
        .p10 { width: 6px; height: 6px; left: 83%; animation-duration: 12s; animation-delay: 2s; background-color: #ea80fc; }
        .p11 { width: 4px; height: 4px; left: 90%; animation-duration: 8.5s; animation-delay: 4.5s; }
        .p12 { width: 5px; height: 5px; left: 96%; animation-duration: 11.5s; animation-delay: 1.2s; }

        @keyframes riseWave {
            0% { transform: translateY(105vh) translateX(0px) rotate(0deg) scale(0.6); opacity: 0; }
            20% { opacity: 1; }
            50% { transform: translateY(45vh) translateX(25px) rotate(180deg) scale(1.2); }
            80% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(-20px) rotate(360deg) scale(0.8); opacity: 0; }
        }

        /* STRUTTURA CONTENUTI */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 35px 20px 50px 20px;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        /* TITOLO E SOTTOTITOLO IN CIMA */
        h1 {
            font-size: 3.8em;
            margin: 10px 0 5px 0;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(224, 64, 251, 0.8), 0 4px 15px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.2em;
            color: #e1bee7;
            margin-bottom: 35px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        /* IMMAGINE / BANNER SOPRA LA CARD IP */
        .hero-banner-wrapper {
            position: relative;
            max-width: 380px;
            margin: 0 auto 25px auto;
            border-radius: 16px;
            padding: 3px;
            background: linear-gradient(135deg, #e040fb, #ffeb3b, #00bcd4, #9c27b0);
            background-size: 300% 300%;
            animation: borderGlow 6s ease infinite, heroFloat 5s ease-in-out infinite;
            box-shadow: 0 10px 35px rgba(156, 39, 176, 0.7), 0 0 20px rgba(0, 188, 212, 0.4);
        }

        .hero-banner-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 14px;
            object-fit: cover;
        }

        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes heroFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        /* Box IP, Porta, Discord, Store e Stato */
        .ip-card {
            background-color: rgba(18, 10, 26, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px 20px;
            border-radius: 16px;
            border: 1px solid rgba(224, 64, 251, 0.45);
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(74, 20, 140, 0.65);
            box-sizing: border-box;
        }

        .ip-box-container, .port-box-container {
            background-color: #030007;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px dashed #ffeb3b;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 15px 0;
            max-width: 100%;
            box-sizing: border-box;
        }

        .port-box-container {
            border-color: #00bcd4;
        }

        .ip-text {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.5em;
            color: #ffeb3b;
            letter-spacing: 1px;
            word-break: break-all;
        }

        .port-text {
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.5em;
            color: #00bcd4;
            letter-spacing: 1px;
